name: Support request
description: Ask for help with Bullpen
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Bullpen. Please do not include player names, medical details, or other private information in this public issue.
  - type: input
    id: app_version
    attributes:
      label: Bullpen version
      description: Found under Team → About.
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: ios_version
    attributes:
      label: iOS version
      placeholder: "iOS 26.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model
      placeholder: "iPhone 16 Pro"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Describe the steps that led to the problem, what you expected, and what happened instead.
      placeholder: "1. Open Today\n2. Tap ...\n3. Expected ...\n4. Saw ..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue does not contain private player or medical information.
          required: true
